<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Electric Ravens: dreams</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #9ab; font: 12px/1.4 ui-monospace, Consolas, monospace; overflow: hidden; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
    #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: linear-gradient(transparent, #000c); display: flex; gap: 12px; align-items: center; transition: opacity .3s; }
    #hud.hidden { opacity: 0; }
    #scrub { flex: 1; accent-color: #d9a441; }
    button { background: #111; color: #cde; border: 1px solid #345; padding: 3px 10px; font: inherit; cursor: pointer; }
    #sections { display: flex; gap: 4px; flex-wrap: wrap; }
    #sections button.on { border-color: #d9a441; color: #d9a441; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hud">
    <button id="play">play</button>
    <span id="time">0:00.0</span>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
    <div id="sections"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
